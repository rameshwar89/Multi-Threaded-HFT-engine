<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFT Order Book Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top right, #130030, #000000 70%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        /* Animated background elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s ease-in-out infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #8a2be2; }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #00ffcc; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        h2 {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #a5a5b0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #a5a5b0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.connected {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field label {
            font-size: 0.85rem;
            color: #a5a5b0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-field input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        button:hover::before {
            transform: translateX(100%);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-buy {
            border-color: rgba(0, 255, 204, 0.3);
            color: #00ffcc;
        }
        .btn-buy:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.15);
        }

        .btn-sell {
            border-color: rgba(255, 51, 102, 0.3);
            color: #ff3366;
        }
        .btn-sell:hover {
            background: rgba(255, 51, 102, 0.1);
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.15);
        }
        
        .btn-subtext {
            font-size: 0.8rem;
            opacity: 0.7;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        #log-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            height: 220px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #a5a5b0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Scrollbar styling */
        #log-container::-webkit-scrollbar { width: 8px; }
        #log-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        #log-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        #log-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .log-time {
            color: #666;
            font-size: 0.8rem;
        }

        .log-msg {
            color: #fff;
        }

        .log-msg.buy { color: #00ffcc; }
        .log-msg.sell { color: #ff3366; }
        .log-msg.system { color: #8a2be2; font-style: italic; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <header>
            <h2>Live Trading Floor Gateway</h2>
            <div class="status">
                <span id="status-text">DISCONNECTED</span>
                <div id="status-dot" class="status-dot"></div>
            </div>
        </header>
        
        <div class="input-group">
            <div class="input-field">
                <label>Shares (Quantity)</label>
                <input type="number" id="qty-input" value="100" min="1" step="1">
            </div>
            <div class="input-field">
                <label>Price ($)</label>
                <input type="number" id="price-input" value="50.50" min="0.01" step="0.01">
            </div>
        </div>

        <div class="controls">
            <button class="btn-buy" onclick="dispatchCustomOrder('B')">
                <span id="buy-btn-text">BUY</span>
                <span class="btn-subtext">Submit customized Buy order</span>
            </button>
            <button class="btn-sell" onclick="dispatchCustomOrder('S')">
                <span id="sell-btn-text">SELL</span>
                <span class="btn-subtext">Submit customized Sell order</span>
            </button>
        </div>
        
        <div id="log-container">
            <!-- Logs will appear here -->
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3000');
        const logDiv = document.getElementById('log-container');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const qtyInput = document.getElementById('qty-input');
        const priceInput = document.getElementById('price-input');
        const buyBtnText = document.getElementById('buy-btn-text');
        const sellBtnText = document.getElementById('sell-btn-text');

        // Dynamic button text updates
        function updateButtonText() {
            const qty = qtyInput.value;
            const price = parseFloat(priceInput.value || 0).toFixed(2);
            buyBtnText.textContent = `BUY ${qty} @ $${price}`;
            sellBtnText.textContent = `SELL ${qty} @ $${price}`;
        }

        qtyInput.addEventListener('input', updateButtonText);
        priceInput.addEventListener('input', updateButtonText);
        updateButtonText(); // init

        ws.onopen = () => {
            statusText.textContent = "ENGINE CONNECTED";
            statusDot.classList.add('connected');
            log("WebSocket bridge established successfully.", "system");
        };

        ws.onclose = () => {
            statusText.textContent = "DISCONNECTED";
            statusDot.classList.remove('connected');
            log("Connection to WebSocket bridge lost.", "system");
        };

        ws.onmessage = (event) => {
            log(`[Engine Broadcast] ${event.data}`, "system");
        };

        function dispatchCustomOrder(side) {
            if (ws.readyState === WebSocket.OPEN) {
                const qty = parseInt(qtyInput.value) || 100;
                const priceFloat = parseFloat(priceInput.value) || 50.50;
                
                // Convert floating price to integer for engine (e.g. 50.50 -> 50500)
                const priceInt = Math.round(priceFloat * 1000); 

                const payload = `${side} ${qty} ${priceInt}`;
                ws.send(payload);
                
                const sideClass = side === 'B' ? 'buy' : 'sell';
                const actionText = side === 'B' ? 'BUY' : 'SELL';
                log(`Dispatched: ${actionText} ${qty} shares @ $${priceFloat.toFixed(2)} [Payload: ${payload}]`, sideClass);
            } else {
                log("Error: Socket closed. Cannot dispatch order.", "sell");
            }
        }

        function log(msg, type = "") {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric", fractionalSecondDigits: 3 });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-msg ${type}">${msg}</span>`;
            
            // Insert at the top
            logDiv.insertBefore(entry, logDiv.firstChild);
        }
    </script>
</body>
</html>
